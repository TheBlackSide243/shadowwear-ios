# Unit tests (palette, categories, the closet on disk, the stylist) and the server: its own tests,
# then two simulated phones syncing through it. On every push and by hand.
name: Unit tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittests:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -vi 'beta' | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Tools
        run: brew install xcodegen

      - name: Xcode project
        run: xcodegen generate

      - name: Server tests
        working-directory: server
        run: node --version && node --test test/*.test.js

      - name: Test server for the sync test
        run: |
          mkdir -p "$RUNNER_TEMP/swdata"
          (cd server && PORT=8099 DATA_DIR="$RUNNER_TEMP/swdata" nohup node src/server.js > "$RUNNER_TEMP/server.log" 2>&1 &)
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8099/api/status && break; sleep 1; done
          PASSWORD="ci-$(uuidgen)"
          curl -fs -X POST -H 'content-type: application/json' -d "{\"user\":\"ci\",\"password\":\"$PASSWORD\"}" http://127.0.0.1:8099/api/setup > /dev/null
          echo "TEST_RUNNER_SW_TEST_SERVER=http://127.0.0.1:8099" >> "$GITHUB_ENV"
          echo "TEST_RUNNER_SW_TEST_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          # A second server left without an account: the app creates it.
          mkdir -p "$RUNNER_TEMP/swnew"
          (cd server && PORT=8098 DATA_DIR="$RUNNER_TEMP/swnew" nohup node src/server.js > "$RUNNER_TEMP/server-new.log" 2>&1 &)
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8098/api/status && break; sleep 1; done
          echo "TEST_RUNNER_SW_TEST_NEW_SERVER=http://127.0.0.1:8098" >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available | grep -E "^\s+iPhone" | grep -v -i duo | tail -1 | sed -E 's/^ +(.*) \([0-9A-F-]+\).*/\1/')
          echo "Simulator: $SIM"
          xcodebuild test -project ShadowWear.xcodeproj -scheme ShadowWear -only-testing:ShadowWearTests \
            -destination "platform=iOS Simulator,name=$SIM" CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee test.log | grep -E "Test Case|error:|XCTAssert|TEST (SUCCEEDED|FAILED)|\*\* "

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-log
          path: |
            test.log
            ${{ runner.temp }}/server.log
          retention-days: 7
