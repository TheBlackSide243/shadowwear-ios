# ShadowWear server as a TrueNAS Custom App (Apps → Discover → Custom App → Install via YAML).
# The image comes from GitHub (ghcr.io): to update, open the app and choose Update / Pull image.
#
#   /mnt/tank/shadowwear/data  closet.json, the photos, auth.json, settings.json (create the dataset first)
#
# Web site and iPhone app: http://<NAS>:30320 in the house; from outside only through a proxy with HTTPS
# (Nginx Proxy Manager, a Cloudflare tunnel). The first account is created from the house, or from
# outside with the setup code in the app's log.
# Guide: https://github.com/TheBlackSide243/shadowwear-ios/blob/main/docs/self-hosting.md
services:
  shadowwear:
    image: ghcr.io/theblackside243/shadowwear-server:latest
    pull_policy: always
    environment:
      TZ: Europe/Rome
      # Optional: the house's Ollama, for "Describe with AI" (the model is chosen on the web site).
      # OLLAMA_URL: http://192.168.1.10:11434
    ports:
      - "30320:8080"
    volumes:
      - /mnt/tank/shadowwear/data:/data
    restart: unless-stopped
